name: Demo quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Prepare local dependencies
        shell: pwsh
        run: .\scripts\Initialize-Lab.ps1 -InstallBrowser
      - name: Run quality gate
        shell: pwsh
        run: .\scripts\Invoke-QualityGate.ps1 -IncludeBrowser
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-quality-evidence
          path: |
            artifacts/quality-gate/
            src/Orders.Web/test-results/
          if-no-files-found: warn
