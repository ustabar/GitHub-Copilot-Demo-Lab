name: PR rehearsal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payload-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Run actual acceptance tests selected by rehearsal checkpoint
        shell: pwsh
        run: .\scripts\Invoke-PrChecks.ps1
